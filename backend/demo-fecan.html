<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FECAN - Clasificación y Resultados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .team-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .team-name {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .team-stats {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .position {
            font-weight: bold;
            font-size: 1.2em;
            color: #667eea;
        }

        .team-highlight {
            background-color: #fff3cd !important;
            font-weight: bold;
        }

        .partido {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .partido:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .partido-jornada {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .partido-info {
            flex: 1;
            padding: 0 20px;
        }

        .equipos {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .resultado {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            min-width: 80px;
            text-align: center;
        }

        .resultado.upcoming {
            color: #6c757d;
            font-size: 1em;
        }

        .detalles {
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: white;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin: 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏀 FECAN - Saski Penguins</h1>
        <p class="subtitle">Clasificación y Resultados en Tiempo Real</p>

        <div id="sp-rosa-section"></div>
        <div id="sp-negro-section"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:3001';

        async function loadTeamData(teamId, sectionId) {
            try {
                const response = await fetch(`${BASE_URL}/api/fecan/complete/${teamId}`);
                const data = await response.json();

                const section = document.getElementById(sectionId);
                
                // Encontrar nuestro equipo en la clasificación
                const nuestroEquipo = data.clasificacion.find(t => 
                    t.team_name.toLowerCase().includes('saski') || 
                    t.team_name.toLowerCase().includes('penguins')
                );

                section.innerHTML = `
                    <div class="team-section">
                        <div class="team-header">
                            <div class="team-name">${data.info.title}</div>
                            <div class="team-stats">
                                <div class="stat-box">
                                    <div class="stat-label">Temporada</div>
                                    <div class="stat-value">${data.info.season}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">Equipos</div>
                                    <div class="stat-value">${data.stats.totalEquipos}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">Partidos Jugados</div>
                                    <div class="stat-value">${data.stats.partidosJugados}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">Próximos</div>
                                    <div class="stat-value">${data.stats.proximosPartidos}</div>
                                </div>
                            </div>
                        </div>

                        <h2 class="section-title">📊 Clasificación</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Pos</th>
                                    <th>Equipo</th>
                                    <th>PJ</th>
                                    <th>G</th>
                                    <th>P</th>
                                    <th>PF</th>
                                    <th>PC</th>
                                    <th>Dif</th>
                                    <th>PTS</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.clasificacion.map(team => `
                                    <tr class="${team.team_name === nuestroEquipo?.team_name ? 'team-highlight' : ''}">
                                        <td class="position">${team.position}</td>
                                        <td>${team.team_name}</td>
                                        <td>${team.played}</td>
                                        <td>${team.won}</td>
                                        <td>${team.lost}</td>
                                        <td>${team.points_for}</td>
                                        <td>${team.points_against}</td>
                                        <td>${team.points_diff > 0 ? '+' : ''}${team.points_diff}</td>
                                        <td><strong>${team.points}</strong></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>

                        <h2 class="section-title">⚽ Partidos</h2>
                        ${data.partidos.map(match => `
                            <div class="partido">
                                <div class="partido-jornada">J${match.jornada}</div>
                                <div class="partido-info">
                                    <div class="equipos">${match.equipo_local} vs ${match.equipo_visitante}</div>
                                    <div class="detalles">
                                        📍 ${match.pabellon} | 
                                        📅 ${match.fecha} ${match.hora || ''}
                                    </div>
                                </div>
                                <div class="resultado ${match.estado === 'upcoming' ? 'upcoming' : ''}">
                                    ${match.estado === 'played' ? 
                                        `${match.resultado_local} - ${match.resultado_visitante}` : 
                                        'Próximo'
                                    }
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error(`Error cargando ${teamId}:`, error);
                document.getElementById(sectionId).innerHTML = `
                    <div class="team-section">
                        <p style="color: red;">❌ Error cargando datos de ${teamId.toUpperCase()}</p>
                    </div>
                `;
            }
        }

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadTeamData('sp-rosa', 'sp-rosa-section');
            loadTeamData('sp-negro', 'sp-negro-section');
        });

        // Recargar cada 30 segundos
        setInterval(() => {
            loadTeamData('sp-rosa', 'sp-rosa-section');
            loadTeamData('sp-negro', 'sp-negro-section');
        }, 30000);
    </script>
</body>
</html>
