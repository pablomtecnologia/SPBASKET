<div class="competiciones-page">
    <app-page-header title="NUESTROS EQUIPOS"
        subtitle="Sigue el camino de los Saski Penguins en sus competiciones"></app-page-header>

    <div class="main-content">
        <div class="container">
            <div class="competitions-grid">
                <div class="competition-card" *ngFor="let comp of competitions"
                    (click)="navigateToCompetition(comp.id)">

                    <div class="image-wrapper">
                        <div class="card-image" [style.background-image]="'url(\'' + comp.image + '\')'"></div>
                        <div class="category-tag">Competición Oficial</div>
                    </div>

                    <div class="card-content">
                        <div class="content-top">
                            <h3>{{ comp.name }}</h3>
                            <p class="season-text">Temporada 2025/2026</p>
                        </div>

                        <div class="stats-mini-grid">
                            <div class="mini-stat">
                                <span class="val">{{ comp.position }}º</span>
                                <span class="lab">Posición</span>
                            </div>
                            <div class="mini-stat">
                                <span class="val">{{ comp.wins }}</span>
                                <span class="lab">Victorias</span>
                            </div>
                            <div class="mini-stat">
                                <span class="val">{{ comp.losses }}</span>
                                <span class="lab">Derrotas</span>
                            </div>
                        </div>

                        <div class="next-match-stripe" *ngIf="comp.nextMatch">
                            <span class="label">PRÓXIMO:</span>
                            <span class="teams">{{ comp.nextMatch.teams }}</span>
                            <span class="date">{{ comp.nextMatch.date }}</span>
                        </div>

                        <div class="card-footer">
                            <span class="btn-text">VER DETALLES</span>
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
