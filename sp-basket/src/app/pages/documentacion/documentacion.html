<div class="documentacion-page">
    <app-page-header title="DOCUMENTACIÓN" subtitle="Documentos importantes y recursos para jugadores y familias">
    </app-page-header>

    <!-- ENLACE AL RECONOCIMIENTO MÉDICO -->
    <section class="section medical-link-section">
        <div class="container">
            <div class="medical-cta-card">
                <div class="cta-content">
                    <div class="cta-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                    </div>
                    <div>
                        <h2>Reconocimiento Médico</h2>
                        <p>Gestiona tu reconocimiento médico, sube documentos y consulta el estado de validación.</p>
                    </div>
                </div>
                <a routerLink="/medical-recognition" class="btn-cta">Ir a Gestión Médica →</a>
            </div>
        </div>
    </section>

    <!-- DOCUMENTOS -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">Documentos Disponibles</h2>

            <!-- ADMIN PANEL -->
            <div class="admin-panel" *ngIf="isAdmin">
                <button class="btn-add" (click)="showForm = !showForm">
                    {{ showForm ? 'Cancelar' : '➕ Añadir Nuevo Documento' }}
                </button>

                <div class="add-doc-form" *ngIf="showForm">
                    <input type="text" [(ngModel)]="newDocTitle" placeholder="Título del documento *"
                        class="form-input">
                    <textarea [(ngModel)]="newDocDesc" placeholder="Descripción" class="form-input" rows="2"></textarea>

                    <div class="form-row">
                        <label>
                            <input type="checkbox" [(ngModel)]="newDocComingSoon"> Próximamente (Sin archivo)
                        </label>
                        <input type="file" (change)="onFileSelected($event)" *ngIf="!newDocComingSoon">
                    </div>

                    <button class="btn-save" (click)="createDocument()" [disabled]="isSubmitting">
                        {{ isSubmitting ? 'Guardando...' : 'Guardar Documento' }}
                    </button>
                </div>
            </div>

            <div class="docs-grid">
                <div class="doc-card" *ngFor="let doc of visibleDocuments" [class.inactive]="!doc.is_active">

                    <!-- Admin Controls Overlay -->
                    <div class="admin-controls" *ngIf="isAdmin" (click)="$event.stopPropagation()">
                        <button class="btn-icon" (click)="toggleStatus(doc, 'is_active'); $event.stopPropagation()"
                            [title]="doc.is_active ? 'Ocultar' : 'Mostrar'">
                            {{ doc.is_active ? '👁️' : '🚫' }}
                        </button>
                        <button class="btn-icon" (click)="toggleStatus(doc, 'coming_soon'); $event.stopPropagation()"
                            [title]="doc.coming_soon ? 'Marcar disponible' : 'Marcar próximamente'">
                            {{ doc.coming_soon ? '⏳' : '✅' }}
                        </button>
                        <button class="btn-icon btn-delete" (click)="deleteDocument(doc.id); $event.stopPropagation()"
                            title="Eliminar">🗑️</button>
                    </div>

                    <div class="doc-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" />
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
                        </svg>
                    </div>
                    <h3>{{ doc.title }}</h3>
                    <p>{{ doc.description }}</p>

                    <div *ngIf="doc.coming_soon; else downloadLink" class="coming-soon-badge">
                        PRÓXIMAMENTE
                    </div>
                    <ng-template #downloadLink>
                        <a [href]="doc.file_url" target="_blank" class="btn btn-outline"
                            *ngIf="doc.file_url">Descargar</a>
                    </ng-template>

                    <div *ngIf="!doc.is_active && isAdmin" class="status-badge hidden">
                        OCULTO
                    </div>
                </div>

                <!-- Empty State -->
                <div *ngIf="visibleDocuments.length === 0" class="no-docs">
                    <p>No hay documentos disponibles en este momento.</p>
                </div>
            </div>
        </div>
    </section>
</div>
