<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPBASKET 3x3 — Tournament Manager</title>
    <meta name="description" content="Gestión de torneos de baloncesto 3x3 — Saski Penguins Basket" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0e1a;
        --accent: #f97316;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: white;
        font-family: 'Inter', sans-serif;
      }
      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/assets/index-Dm12vNYe.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CDqSr10G.css">
  </head>
  <body>
    <div id="root-loader">
      <div class="spinner"></div>
      <p style="font-weight: 600; letter-spacing: 1px; color: var(--accent);">PREPARANDO CANCHA...</p>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('root-loader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }, 800);
        }
      });
    </script>
  </body>
</html>
