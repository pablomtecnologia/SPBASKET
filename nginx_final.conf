server {
    listen 80;
    server_name saskipenguins.com www.saskipenguins.com spbasket.com www.spbasket.com saskipenguins.es www.saskipenguins.es spbasket.es www.spbasket.es;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name saskipenguins.com www.saskipenguins.com;

    ssl_certificate /etc/letsencrypt/live/saskipenguins.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saskipenguins.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api-3x3/ {
        proxy_pass http://localhost:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /3x3 {
        alias /var/www/html/3x3/;
        try_files $uri $uri/ /3x3/index.html;
    }
}

